# ============================================================
# CONFIGURACION DE BASE DE DATOS - PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/natymoon
spring.datasource.username=postgres
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=validate porque el esquema ya se crea con el script SQL (natymoo_database.sql)
# Cambia a "update" temporalmente solo si quieres que Hibernate cree las tablas por ti.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080

# ============================================================
# JWT
# ============================================================
# Clave secreta para firmar el JWT (cambiala en produccion, minimo 256 bits / 32 caracteres)
app.jwt.secret=NatymooSuperSecretKeyParaJWT2026CambiarEnProduccion123456789
# Duracion del token en milisegundos (24 horas)
app.jwt.expiration-ms=86400000
# Nombre de la cookie donde se guarda el JWT
app.jwt.cookie-name=natymoo_token
# true en produccion con HTTPS
app.jwt.cookie-secure=false

# ============================================================
# CORS - Frontend
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://appassets.androidplatform.net
